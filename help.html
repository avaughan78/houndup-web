<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help — Hound-Up</title>
<link rel="icon" href="img/favicon-32.png" sizes="32x32">
<link rel="icon" href="img/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<style>
  .help-search { margin-bottom: 28px; }
  .help-category { font-size: 12.5px; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; }
  .help-category:first-of-type { margin-top: 0; }
  .help-list { display: flex; flex-direction: column; gap: 8px; }
  .help-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 13px 16px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 14.5px; cursor: pointer; }
  .help-row:hover { border-color: var(--accent); }
  .help-row .chev { color: var(--muted); font-weight: 400; }
  .help-empty { color: var(--muted); font-size: 14.5px; padding: 12px 2px; }
  #detail-view { display: none; }
  .help-back { display: inline-block; margin-bottom: 18px; color: var(--accent); font-weight: 700; font-size: 13.5px; text-decoration: none; cursor: pointer; }
  .help-article-body p { margin: 0 0 14px; }
  .plan-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 12px 16px 4px; margin-bottom: 10px; }
  .plan-card .feature { font-weight: 800; font-size: 14px; margin-bottom: 6px; }
  .plan-line { display: flex; gap: 10px; padding: 8px 0; font-size: 13.5px; }
  .plan-line + .plan-line { border-top: 1px solid var(--hairline); }
  .plan-line .plan-label { flex: 0 0 92px; font-weight: 800; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--muted); padding-top: 1px; }
  .plan-line.pro .plan-label { color: var(--accent); }
  .plan-line .plan-value { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">Hound-Up</a>
    <nav>
      <a href="/help.html" aria-current="page">Help</a>
      <a href="/support.html">Support</a>
      <a href="/privacy.html">Privacy</a>
    </nav>
  </header>

  <div id="list-view">
    <h1>Help</h1>
    <p class="meta">Search for anything, or have a look through the list below. Written in plain English — no jargon.</p>

    <div class="field help-search">
      <input type="text" id="search" placeholder="Search help, e.g. &quot;invoice&quot; or &quot;backup&quot;" autocomplete="off">
    </div>

    <div id="results"></div>
  </div>

  <div id="detail-view">
    <a class="help-back" id="back-link">&larr; Back to Help</a>
    <h1 id="detail-title"></h1>
    <div id="detail-body"></div>
  </div>

  <footer>
    Hound-Up &middot; <a href="/support.html">Contact support</a> &middot; <a href="/privacy.html">Privacy Policy</a> &middot; <a href="/terms.html">Terms of Service</a>
  </footer>
</div>

<script>
  let articles = [];

  function categoriesInOrder(list) {
    const seen = new Set();
    const ordered = [];
    for (const a of list) {
      if (!seen.has(a.category)) { seen.add(a.category); ordered.push(a.category); }
    }
    return ordered;
  }

  function renderList(query) {
    const results = document.getElementById("results");
    results.innerHTML = "";
    const q = (query || "").trim().toLowerCase();

    if (!q) {
      for (const category of categoriesInOrder(articles)) {
        const heading = document.createElement("div");
        heading.className = "help-category";
        heading.textContent = category;
        results.appendChild(heading);

        const list = document.createElement("div");
        list.className = "help-list";
        articles.filter((a) => a.category === category).forEach((a) => list.appendChild(articleRow(a)));
        results.appendChild(list);
      }
      return;
    }

    const matches = articles.filter((a) =>
      a.title.toLowerCase().includes(q) ||
      a.body.some((p) => p.toLowerCase().includes(q)) ||
      (a.rows || []).some((r) => r.feature.toLowerCase().includes(q))
    );

    if (matches.length === 0) {
      const empty = document.createElement("div");
      empty.className = "help-empty";
      empty.textContent = `No help articles match "${query}" — try a different word.`;
      results.appendChild(empty);
      return;
    }

    const list = document.createElement("div");
    list.className = "help-list";
    matches.forEach((a) => list.appendChild(articleRow(a)));
    results.appendChild(list);
  }

  function articleRow(article) {
    const row = document.createElement("a");
    row.className = "help-row";
    row.href = `#${article.id}`;
    row.innerHTML = `<span>${article.title}</span><span class="chev">&rsaquo;</span>`;
    return row;
  }

  function renderDetail(article) {
    document.getElementById("detail-title").textContent = article.title;
    const body = document.getElementById("detail-body");
    body.innerHTML = "";

    if (article.kind === "planComparison" && article.rows) {
      const intro = document.createElement("div");
      intro.className = "help-article-body";
      article.body.forEach((p) => {
        const para = document.createElement("p");
        para.textContent = p;
        intro.appendChild(para);
      });
      body.appendChild(intro);

      article.rows.forEach((row) => {
        const card = document.createElement("div");
        card.className = "plan-card";
        card.innerHTML = `
          <div class="feature">${row.feature}</div>
          <div class="plan-line"><span class="plan-label">Free</span><span class="plan-value">${row.free}</span></div>
          <div class="plan-line pro"><span class="plan-label">Hound-Up Pro</span><span class="plan-value">${row.pro}</span></div>
        `;
        body.appendChild(card);
      });
      return;
    }

    const wrap = document.createElement("div");
    wrap.className = "help-article-body";
    article.body.forEach((p) => {
      const para = document.createElement("p");
      para.textContent = p;
      wrap.appendChild(para);
    });
    body.appendChild(wrap);
  }

  function showList() {
    document.getElementById("list-view").style.display = "block";
    document.getElementById("detail-view").style.display = "none";
  }

  function showDetail(article) {
    renderDetail(article);
    document.getElementById("list-view").style.display = "none";
    document.getElementById("detail-view").style.display = "block";
    window.scrollTo(0, 0);
  }

  function routeFromHash() {
    const id = window.location.hash.replace(/^#/, "");
    if (!id) { showList(); return; }
    const article = articles.find((a) => a.id === id);
    if (article) showDetail(article); else showList();
  }

  document.getElementById("search").addEventListener("input", (e) => renderList(e.target.value));
  document.getElementById("back-link").addEventListener("click", () => { window.location.hash = ""; });
  window.addEventListener("hashchange", routeFromHash);

  fetch("/help-content.json")
    .then((r) => r.json())
    .then((data) => {
      articles = data.articles || [];
      renderList("");
      routeFromHash();
    })
    .catch(() => {
      document.getElementById("results").innerHTML = '<p class="help-empty">Couldn\'t load help articles — check your connection and reload the page.</p>';
    });
</script>
</body>
</html>
